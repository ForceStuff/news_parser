name: news-parser-integration
services:
  file-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: parser_files
      POSTGRES_USER: parser_files
      POSTGRES_PASSWORD: ${FILE_DB_PASSWORD:?Set FILE_DB_PASSWORD}
    volumes:
      - file-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parser_files -d parser_files"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  files:
    build:
      context: ../file_service
    environment:
      DATABASE_URL: postgresql+asyncpg://parser_files:${FILE_DB_PASSWORD}@file-db:5432/parser_files
      STORAGE_BACKEND: local
      LOCAL_STORAGE_PATH: /var/lib/fsp-files
      SERVICE_REGISTRY_PATH: /run/parser/services.json
      PARSER_UPLOAD_TOKEN: ${PARSER_UPLOAD_TOKEN:?Set PARSER_UPLOAD_TOKEN}
      AUTO_CREATE_TABLES: "true"
    volumes:
      - file-objects:/var/lib/fsp-files
      - ./integration/file-services.json:/run/parser/services.json:ro
    ports:
      - "127.0.0.1:8001:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      file-db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  file-db:
  file-objects:
